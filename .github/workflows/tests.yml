name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: the job only checks out and tests (L-7)
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      # Actions pinned to commit SHAs (L-7); the comment names the release
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install system deps for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pytest

      - name: Run pytest
        run: pytest tests/ -v --ignore=tests/e2e
