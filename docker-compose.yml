services:
  ptvault:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Run as the owner of ./data (L-5): PTVAULT_UID=$(id -u) PTVAULT_GID=$(id -g) docker compose build
        PTVAULT_UID: ${PTVAULT_UID:-1000}
        PTVAULT_GID: ${PTVAULT_GID:-1000}
    container_name: ptvault
    ports:
      # This machine only (L-5). Secure cookies need HTTPS anyway, so reach it from
      # other machines through a TLS reverse proxy rather than publishing 0.0.0.0.
      - "127.0.0.1:5000:5000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      # Persist database and uploads
      - ./data:/app/data
      # Mount .env file for configuration
      - ./.env:/app/.env:ro
    environment:
      - FLASK_APP=app.py
      - PYTHONUNBUFFERED=1
      - DATABASE_PATH=/app/data/ptvault.db
      - ENVIRONMENT=production
      # Encryption: key/salt files stored in persistent data volume by default
      # - PTVAULT_ENCRYPTION_REQUIRED=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - ptvault-network

networks:
  ptvault-network:
    driver: bridge
