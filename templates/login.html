<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTVault - Login</title>
    <link rel="stylesheet" href="/static/vendor/host-grotesk-5.3.0/host-grotesk.css">
    <link rel="stylesheet" href="/static/vendor/atkinson-hyperlegible-mono-5.3.0/atkinson-hyperlegible-mono.css">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="auth-page">
    <main class="auth-container">
        <section class="auth-intro" aria-label="About PTVault">
            <p class="auth-wordmark">PTVault</p>
            <p class="auth-lede">Secure Evidence Locker for Pentesters and Security Auditors.</p>
        </section>
        <div class="auth-card">
            <div class="auth-header">
                <h1>Sign in</h1>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginIdentity">Email or Username</label>
                    <input
                        type="text"
                        id="loginIdentity"
                        name="identity"
                        placeholder="you@example.com or username"
                        required
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div id="idleMessage" class="info-message auth-notice" style="display: none;">
                    You were logged out due to inactivity.
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>

                <button type="submit" class="btn btn-primary btn-block">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loading" style="display: none;">Authenticating…</span>
                </button>
            </form>

            <div class="auth-footer">
                <p class="version measured">v1.1.0</p>
            </div>
        </div>
    </main>

    <script type="module" src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/pages/login.js"></script>
</body>
</html>
