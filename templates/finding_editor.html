<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finding Editor - PTVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script>
        // Apply theme before first paint to prevent flash
        (function() {
            var theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        .finding-editor-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--color-border);
        }

        .page-header h1 {
            margin: 0;
            font-size: var(--text-2xl);
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .page-actions {
            display: flex;
            gap: 10px;
        }

        .editor-container {
            background: var(--color-bg-secondary);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
        }

        .form-row {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--color-text-primary);
            font-size: var(--text-sm);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            transition: border-color 0.15s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-primary-subtle);
        }

        .flex-1 { flex: 1; }
        .flex-2 { flex: 2; }

        .editor-section {
            margin-bottom: 20px;
        }

        .editor-section > .section-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--color-text-primary);
            font-size: var(--text-sm);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: var(--text-sm);
            color: var(--color-text-secondary);
        }

        /* EasyMDE overrides */
        .EasyMDEContainer .editor-toolbar {
            /* Reset main.css .editor-toolbar flex interference */
            display: block !important;
            gap: unset !important;
            background: var(--color-bg-tertiary) !important;
            border-top: 1px solid var(--color-border) !important;
            border-left: 1px solid var(--color-border) !important;
            border-right: 1px solid var(--color-border) !important;
            border-bottom: none !important;
            border-radius: var(--radius-md) var(--radius-md) 0 0 !important;
            padding: 6px 8px !important;
        }

        .EasyMDEContainer .editor-toolbar button {
            color: var(--color-text-primary) !important;
            background: transparent !important;
            border: 1px solid transparent !important;
            border-radius: var(--radius-sm) !important;
        }

        .EasyMDEContainer .editor-toolbar button:hover,
        .EasyMDEContainer .editor-toolbar button.active {
            background: var(--color-primary-muted) !important;
            border-color: var(--color-primary) !important;
            color: var(--color-primary) !important;
        }

        .EasyMDEContainer .editor-toolbar i.separator {
            border-left-color: var(--color-border) !important;
        }

        .EasyMDEContainer .CodeMirror {
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            border-color: var(--color-border);
            border-top: none;
            border-radius: 0 0 var(--radius-md) var(--radius-md);
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
            min-height: 280px;
            padding: 8px 4px;
        }

        .EasyMDEContainer .CodeMirror-scroll {
            min-height: 280px;
        }

        .EasyMDEContainer .CodeMirror-cursor {
            border-left-color: var(--color-primary);
        }

        .EasyMDEContainer .editor-preview,
        .EasyMDEContainer .editor-preview-side {
            background: var(--color-bg-secondary);
            color: var(--color-text-primary);
            border-color: var(--color-border);
            padding: 16px;
        }

        .EasyMDEContainer .editor-preview p { margin: 0 0 0.75em 0; }
        .EasyMDEContainer .editor-preview h1,
        .EasyMDEContainer .editor-preview h2,
        .EasyMDEContainer .editor-preview h3 { margin: 1em 0 0.4em 0; font-weight: 600; }
        .EasyMDEContainer .editor-preview pre { background: var(--color-surface-code); color: #e2e8f0; padding: 0.75em; border-radius: var(--radius-md); overflow-x: auto; margin: 0 0 0.75em 0; }
        .EasyMDEContainer .editor-preview code { background: var(--color-bg-tertiary); padding: 0.1em 0.3em; border-radius: var(--radius-sm); font-size: 0.875em; }
        .EasyMDEContainer .editor-preview pre code { background: none; padding: 0; }
        .EasyMDEContainer .editor-preview blockquote { border-left: 3px solid var(--color-primary); padding: 0.25em 0.75em; color: var(--color-text-secondary); margin: 0 0 0.75em 0; }
        .EasyMDEContainer .editor-preview table { border-collapse: collapse; width: 100%; margin: 0 0 0.75em 0; }
        .EasyMDEContainer .editor-preview th,
        .EasyMDEContainer .editor-preview td { border: 1px solid var(--color-border); padding: 0.4em 0.6em; }
        .EasyMDEContainer .editor-preview th { background: var(--color-bg-tertiary); font-weight: 600; }

        /* Dark mode CodeMirror syntax */
        [data-theme="dark"] .EasyMDEContainer .CodeMirror .cm-header { color: #569cd6; font-weight: 600; }
        [data-theme="dark"] .EasyMDEContainer .CodeMirror .cm-strong { color: #dcdcaa; }
        [data-theme="dark"] .EasyMDEContainer .CodeMirror .cm-em { color: #ce9178; }
        [data-theme="dark"] .EasyMDEContainer .CodeMirror .cm-link { color: #4fc3f7; }
        [data-theme="dark"] .EasyMDEContainer .CodeMirror .cm-url { color: #4fc3f7; }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <div class="finding-editor-page">
        <div class="page-header">
            <h1 id="pageTitle">Add Finding</h1>
            <div class="page-actions">
                <button onclick="cancelFinding()" class="btn btn-secondary">Cancel</button>
                <button onclick="saveFinding()" class="btn btn-primary" id="saveBtn">Save Finding</button>
            </div>
        </div>

        <div class="editor-container">
            <!-- Title / Criticality / CVSS row -->
            <div class="form-row">
                <div class="form-group flex-2">
                    <label for="findingTitle">Title *</label>
                    <input type="text" id="findingTitle" required placeholder="e.g., SQL Injection in Login Form">
                </div>
                <div class="form-group flex-1">
                    <label for="findingCriticality">Criticality *</label>
                    <select id="findingCriticality" required>
                        <option value="critical">Critical</option>
                        <option value="high">High</option>
                        <option value="medium" selected>Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
                <div class="form-group flex-1">
                    <label for="findingCvss">CVSS Score</label>
                    <input type="number" id="findingCvss" min="0" max="10" step="0.1" placeholder="0.0 – 10.0">
                </div>
            </div>

            <!-- IP / Hostname row -->
            <div class="form-row">
                <div class="form-group flex-1">
                    <label for="findingIpAddress">IP Address</label>
                    <input type="text" id="findingIpAddress" placeholder="e.g., 192.168.1.100">
                </div>
                <div class="form-group flex-1">
                    <label for="findingHostname">Hostname</label>
                    <input type="text" id="findingHostname" placeholder="e.g., dc01.domain.local">
                </div>
            </div>

            <!-- Finding Details -->
            <div class="editor-section">
                <span class="section-label">Finding Details</span>
                <textarea id="findingContent"></textarea>
            </div>

            <!-- Remediation Notes -->
            <div class="editor-section">
                <span class="section-label">Remediation Notes</span>
                <textarea id="remediationContent"></textarea>
            </div>

            <!-- Include in report -->
            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="findingIncludeReport" checked>
                    <span>Include in final report</span>
                </label>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
    <script src="/static/js/clipboard_image_paste.js"></script>
    <script type="module" src="/static/js/api.js"></script>
    <script src="/static/js/utils.js"></script>
    <script>
        // Initialize EasyMDE instances
        const findingMDE = new EasyMDE({
            element: document.getElementById('findingContent'),
            placeholder: 'Describe the vulnerability, impact, and proof of concept...',
            spellChecker: false,
            autosave: { enabled: false },
            minHeight: '280px',
            toolbar: [
                'bold', 'italic', 'heading', '|',
                'quote', 'code', 'unordered-list', 'ordered-list', '|',
                'link', '|',
                'preview', 'side-by-side', 'fullscreen'
            ]
        });

        const remediationMDE = new EasyMDE({
            element: document.getElementById('remediationContent'),
            placeholder: 'Describe recommended fixes and mitigations...',
            spellChecker: false,
            autosave: { enabled: false },
            minHeight: '280px',
            toolbar: [
                'bold', 'italic', 'heading', '|',
                'quote', 'code', 'unordered-list', 'ordered-list', '|',
                'link', '|',
                'preview', 'side-by-side', 'fullscreen'
            ]
        });

        // Clipboard image paste for both editors
        [findingMDE, remediationMDE].forEach(function(mde) {
            attachClipboardImagePaste(mde, {
                engagementId: function () {
                    return window.AppState && window.AppState.activeEngagement
                        ? window.AppState.activeEngagement.id
                        : null;
                },
                hostId: function () { return null; }, // findings don't carry a host context
                onError: function (msg) {
                    if (window.showToast) window.showToast(msg, 'error');
                    else console.warn(msg);
                },
            });
        });

        // Get parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const hostIp = urlParams.get('host_ip') || '';
        const hostHostname = urlParams.get('host_hostname') || '';
        const returnHost = urlParams.get('return_host');
        const returnTab = urlParams.get('return_tab');
        const editFindingId = urlParams.get('finding_id');

        let isEditMode = !!editFindingId;
        let editEngagementId = null;

        if (isEditMode) {
            document.getElementById('pageTitle').textContent = 'Edit Finding';
            document.getElementById('saveBtn').textContent = 'Update Finding';
            document.title = 'Edit Finding - PTVault';
            waitForAPI().then(() => loadFindingForEdit(parseInt(editFindingId)));
        } else {
            if (hostIp) document.getElementById('findingIpAddress').value = hostIp;
            if (hostHostname) document.getElementById('findingHostname').value = hostHostname;
        }

        // Initialize theme
        document.addEventListener('DOMContentLoaded', function() {
            ThemeManager.init();
        });

        function waitForAPI() {
            return new Promise(resolve => {
                if (window.API) return resolve();
                const check = setInterval(() => {
                    if (window.API) { clearInterval(check); resolve(); }
                }, 50);
            });
        }

        async function loadFindingForEdit(findingId) {
            try {
                const activeData = await API.engagements.getActive();
                editEngagementId = activeData.id || activeData.active_engagement_id || null;
                if (!editEngagementId) {
                    alert('No active engagement.');
                    window.location.href = '/dashboard';
                    return;
                }

                const findings = await API.engagements.getFindings(editEngagementId);
                const finding = findings.find(f => f.id === findingId);
                if (!finding) {
                    alert('Finding not found.');
                    window.location.href = getDashboardReturnUrl();
                    return;
                }

                document.getElementById('findingTitle').value = finding.title || '';
                document.getElementById('findingIpAddress').value = finding.ip_address || '';
                document.getElementById('findingHostname').value = finding.hostname || '';
                document.getElementById('findingCriticality').value = finding.criticality || 'medium';
                document.getElementById('findingCvss').value = finding.cvss_score !== null && finding.cvss_score !== undefined ? finding.cvss_score : '';
                document.getElementById('findingIncludeReport').checked = finding.include_in_report;

                findingMDE.value(finding.finding_content || '');
                remediationMDE.value(finding.remediation_content || '');
            } catch (error) {
                console.error('Failed to load finding:', error);
                alert('Failed to load finding for editing.');
                window.location.href = getDashboardReturnUrl();
            }
        }

        function getDashboardReturnUrl() {
            const params = new URLSearchParams();
            if (returnHost) params.set('host', returnHost);
            if (returnTab) params.set('tab', returnTab);
            const qs = params.toString();
            return '/dashboard' + (qs ? '?' + qs : '');
        }

        async function saveFinding() {
            const title = document.getElementById('findingTitle').value.trim();
            if (!title) {
                alert('Title is required');
                return;
            }

            const findingData = {
                title,
                ip_address: document.getElementById('findingIpAddress').value.trim() || null,
                hostname: document.getElementById('findingHostname').value.trim() || null,
                criticality: document.getElementById('findingCriticality').value,
                cvss_score: document.getElementById('findingCvss').value ? parseFloat(document.getElementById('findingCvss').value) : null,
                finding_content: findingMDE.value() || null,
                remediation_content: remediationMDE.value() || null,
                include_in_report: document.getElementById('findingIncludeReport').checked
            };

            try {
                if (isEditMode) {
                    const engId = editEngagementId || (await API.engagements.getActive()).id;
                    await API.engagements.updateFinding(engId, parseInt(editFindingId), findingData);
                } else {
                    const activeData = await API.engagements.getActive();
                    const activeEngagementId = activeData.id || activeData.active_engagement_id || null;
                    if (!activeEngagementId) {
                        alert('No active engagement. Please select an engagement first.');
                        window.location.href = '/dashboard';
                        return;
                    }
                    await API.engagements.createFinding(activeEngagementId, findingData);
                }

                window.location.href = getDashboardReturnUrl();
            } catch (error) {
                console.error('Failed to save finding:', error);
                alert('Failed to save finding: ' + (error.message || 'Please try again.'));
            }
        }

        function cancelFinding() {
            const hasContent = document.getElementById('findingTitle').value.trim() || findingMDE.value().trim();
            if (!isEditMode && hasContent && !confirm('Discard this finding?')) return;
            if (isEditMode && !confirm('Discard changes?')) return;
            window.location.href = getDashboardReturnUrl();
        }
    </script>
</body>
</html>
