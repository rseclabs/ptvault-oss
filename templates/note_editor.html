<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Note - PTVault</title>
    <link rel="stylesheet" href="/static/vendor/host-grotesk-5.3.0/host-grotesk.css">
    <link rel="stylesheet" href="/static/vendor/atkinson-hyperlegible-mono-5.3.0/atkinson-hyperlegible-mono.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/vendor/easymde-2.21.0/easymde.min.css">
    <link rel="stylesheet" href="/static/vendor/font-awesome-4.7.0/css/font-awesome.min.css">
    <script src="/static/js/lib/theme_init.js"></script>
    <style>
        .note-editor-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--space-lg) 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-lg);
            padding-bottom: var(--space-md);
            border-bottom: 1px solid var(--color-border);
        }

        .page-header h1 {
            margin: 0;
            font-size: var(--text-2xl);
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .page-actions {
            display: flex;
            gap: 10px;
        }

        .editor-container {
            background: var(--color-bg-secondary);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            box-shadow: var(--shadow-sm);
        }

        /* EasyMDE overrides */
        .EasyMDEContainer .editor-toolbar {
            /* Reset main.css .editor-toolbar flex interference */
            display: block !important;
            gap: unset !important;
            background: var(--color-bg-tertiary) !important;
            border-top: 1px solid var(--color-border) !important;
            border-left: 1px solid var(--color-border) !important;
            border-right: 1px solid var(--color-border) !important;
            border-bottom: none !important;
            border-radius: var(--radius-md) var(--radius-md) 0 0 !important;
            padding: 6px var(--space-xs) !important;
        }

        .EasyMDEContainer .editor-toolbar button {
            color: var(--color-text-primary) !important;
            background: transparent !important;
            border: 1px solid transparent !important;
            border-radius: var(--radius-sm) !important;
        }

        .EasyMDEContainer .editor-toolbar button:hover,
        .EasyMDEContainer .editor-toolbar button.active {
            background: var(--color-primary-muted) !important;
            border-color: var(--color-primary) !important;
            color: var(--color-primary) !important;
        }

        .EasyMDEContainer .editor-toolbar i.separator {
            border-left-color: var(--color-border) !important;
        }

        .EasyMDEContainer .CodeMirror {
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            border-color: var(--color-border);
            border-top: none;
            border-radius: 0 0 var(--radius-md) var(--radius-md);
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.6;
            min-height: 520px;
            padding: var(--space-xs) var(--space-2xs);
        }

        .EasyMDEContainer .CodeMirror-scroll {
            min-height: 520px;
        }

        .EasyMDEContainer .CodeMirror-cursor {
            border-left-color: var(--color-primary);
        }

        .EasyMDEContainer .editor-preview,
        .EasyMDEContainer .editor-preview-side {
            background: var(--color-bg-secondary);
            color: var(--color-text-primary);
            border-color: var(--color-border);
            padding: var(--space-md);
        }

        .EasyMDEContainer .editor-preview p { margin: 0 0 0.75em 0; }
        .EasyMDEContainer .editor-preview h1,
        .EasyMDEContainer .editor-preview h2,
        .EasyMDEContainer .editor-preview h3 { margin: 1em 0 0.4em 0; font-weight: 600; }
        .EasyMDEContainer .editor-preview pre { background: var(--color-surface-code); color: var(--color-ink-2); padding: 0.75em; border-radius: var(--radius-md); overflow-x: auto; margin: 0 0 0.75em 0; }
        .EasyMDEContainer .editor-preview code { background: var(--color-bg-tertiary); padding: 0.1em 0.3em; border-radius: var(--radius-sm); font-size: 0.875em; }
        .EasyMDEContainer .editor-preview pre code { background: none; padding: 0; }
        .EasyMDEContainer .editor-preview blockquote { border-left: 3px solid var(--color-primary); padding: 0.25em 0.75em; color: var(--color-text-secondary); margin: 0 0 0.75em 0; }
        .EasyMDEContainer .editor-preview table { border-collapse: collapse; width: 100%; margin: 0 0 0.75em 0; }
        .EasyMDEContainer .editor-preview th,
        .EasyMDEContainer .editor-preview td { border: 1px solid var(--color-border); padding: 0.4em 0.6em; }
        .EasyMDEContainer .editor-preview th { background: var(--color-bg-tertiary); font-weight: 600; }

        /* Dark mode CodeMirror syntax */
        [data-theme="dark"] .EasyMDEContainer .CodeMirror .cm-comment { color: var(--palette-6a9955); }
        [data-theme="dark"] .EasyMDEContainer .CodeMirror .cm-header { color: var(--palette-569cd6); font-weight: 600; }
        [data-theme="dark"] .EasyMDEContainer .CodeMirror .cm-strong { color: var(--palette-dcdcaa); }
        [data-theme="dark"] .EasyMDEContainer .CodeMirror .cm-em { color: var(--palette-ce9178); }
        [data-theme="dark"] .EasyMDEContainer .CodeMirror .cm-link { color: var(--palette-4fc3f7); }
        [data-theme="dark"] .EasyMDEContainer .CodeMirror .cm-url { color: var(--palette-4fc3f7); }
        [data-theme="dark"] .EasyMDEContainer .CodeMirror .cm-string { color: var(--palette-ce9178); }
        [data-theme="dark"] .EasyMDEContainer .CodeMirror .cm-keyword { color: var(--palette-c586c0); }

        /* Image upload hint */
        .upload-hint {
            margin-top: var(--space-xs);
            font-size: var(--text-xs);
            color: var(--color-text-muted);
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="note-editor-page">
        <div class="page-header">
            <h1>Add Note</h1>
            <div class="page-actions">
                <button data-on-click='["cancelNote"]' class="btn btn-secondary">Cancel</button>
                <button data-on-click='["saveNote"]' class="btn btn-primary" id="saveNoteBtn">Save Note</button>
            </div>
        </div>

        <div class="editor-container">
            <textarea id="noteContent"></textarea>
            <p class="upload-hint">Paste screenshots with Ctrl+V, or upload images from the toolbar. Markdown is supported.</p>
        </div>
    </div>

    <!-- Hidden file input for image upload -->
    <input type="file" id="noteImageInput" accept="image/*" style="display:none" data-on-change='["handleNoteImage"]'>

    <script src="/static/vendor/easymde-2.21.0/easymde.min.js"></script>
    <!-- Markdown: marked's output is always sanitized by DOMPurify (static/js/lib/markdown.js, H-9) -->
    <script src="/static/vendor/marked-18.1.1/marked.umd.js"></script>
    <script src="/static/vendor/dompurify-3.4.17/purify.min.js"></script>
    <script src="/static/js/lib/markdown.js"></script>
    <script src="/static/js/clipboard_image_paste.js?v=2"></script>
    <script type="module" src="/static/js/api.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/pages/note_editor.js"></script>
</body>
</html>
